name: Verify foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 · real CPU · browser · native Qt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Install standard Ubuntu native GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core \
            libgl1 libegl1 libopengl0 libnss3 libnspr4 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-util1 libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxrender1 libxtst6 libxi6 libasound2t64 libgbm1 libxshmfence1 libxkbfile1
      - name: Install exact Python and browser-test profiles
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen --all-extras --python 3.12
          npm ci
      - name: Lint, compile and package
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync python -m compileall -q src
          npm run check
          uv build
      - name: Unit/API/storage/autonomy plus actual PPO subprocess tests
        run: uv run --no-sync pytest -q -m 'not desktop'
      - name: Actual native Qt window, detached backend and real worker independence
        env:
          RLAI_NATIVE_TEST: "1"
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
        run: xvfb-run -a -s '-screen 0 1440x1000x24' uv run --no-sync pytest -q -m desktop --basetemp=native-test-results
      - name: Actual browser lifecycle with isolated real CPU workers
        env:
          RLAI_TEST_CUDA_UNAVAILABLE: "1"
        run: npm test
      - name: Upload disposable UI verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-verification
          path: |
            test-results/
            native-test-results/**/native-*.png
          if-no-files-found: ignore
          retention-days: 7
