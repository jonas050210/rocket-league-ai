name: Verify foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 · real CPU · browser · native Qt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Install standard Ubuntu native GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core \
            libgl1 libegl1 libopengl0 libnss3 libnspr4 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-util1 libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxrender1 libxtst6 libxi6 libasound2t64 libgbm1 libxshmfence1 libxkbfile1
      - name: Install exact Python and browser-test profiles
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen --all-extras --python 3.12
          npm ci
      - name: Lint, compile and package
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync python -m compileall -q src
          npm run check
          uv build
      - name: Unit/API/storage/autonomy plus actual PPO subprocess tests
        run: |
          mkdir -p .rlai
          status=0
          uv run --no-sync pytest -q -m 'not desktop' --junitxml=.rlai/python-junit.xml || status=$?
          uv run --no-sync python scripts/report_junit.py .rlai/python-junit.xml 'Unit and real PPO tests'
          exit "$status"
      - name: Actual native Qt window, detached backend and real worker independence
        env:
          RLAI_NATIVE_TEST: "1"
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
        run: |
          status=0
          xvfb-run -a -s '-screen 0 1440x1000x24' uv run --no-sync pytest -q -m desktop \
            --basetemp=native-test-results --junitxml=.rlai/native-junit.xml || status=$?
          uv run --no-sync python scripts/report_junit.py .rlai/native-junit.xml 'Native Qt desktop tests'
          exit "$status"
      - name: Actual browser lifecycle with isolated real CPU workers
        if: ${{ !cancelled() && (success() || failure()) }}
        env:
          RLAI_TEST_CUDA_UNAVAILABLE: "1"
        run: npm test
      - name: Upload disposable UI verification artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ui-verification
          path: |
            test-results/
            native-test-results/**/native-*.png
          if-no-files-found: ignore
          retention-days: 7
