[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rocket-league-ai"
version = "0.3.0"
description = "Local-first web control plane for headless RocketSim reinforcement learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "starlette==0.52.1",
  "pydantic==2.14.1",
  "uvicorn==0.42.0",
  "psutil==7.2.2",
]

[project.optional-dependencies]
training = [
  "rlgym-api==2.0.0",
  "rlgym-rocket-league[sim]==2.0.1",
  "rocketsim==2.2.1",
  "rlgym-learn==2.0.0",
  "rlgym-learn-algos==0.4.2",
  "numpy==1.26.4",
  "torch==2.9.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.11.8"]

[project.scripts]
rocket-ai = "rocket_league_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rocket_league_ai"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: real RocketSim / RLGym Learn / PyTorch subprocess tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
